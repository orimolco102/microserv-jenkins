<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="front.js" defer></script>
<title>web service</title>
<style>
  :root{
    --bg:#0B0E14;
    --panel:#131722;
    --border:#1F2430;
    --text:#E6E9EF;
    --muted:#8B93A7;
    --ok:#2DD4BF;
    --fail:#F0605A;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .page{
  display:flex;
  flex-direction:column;
  gap:20px;
  width:100%;
  max-width:520px;
  }
  .card{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .card-head{
    padding:20px 24px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .card-head h1{font-size:15px;font-weight:600;letter-spacing:.02em}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--muted);
    display:inline-block;margin-left:8px;
  }
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.fail{background:var(--fail);box-shadow:0 0 8px var(--fail)}
  .status-row{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .build-strip{
    padding:14px 24px;
    background:#0E1119;
    border-bottom:1px solid var(--border);
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    display:flex;
    gap:18px;
  }
  .build-strip b{color:var(--text);font-weight:500}
  .body{padding:20px 24px}
  .body p.lead{font-size:13px;color:var(--muted);margin-bottom:14px}
  ul{list-style:none}
  li{
    font-family:var(--mono);
    font-size:13px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:6px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
  }
  li span.id{color:var(--muted)}
  .empty, .error{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .error{color:var(--fail)}
</style>
</head>
<body>

  <div class="page">
    
    <div class="card">
      <div class="card-head">
        <h1>web</h1>
        <div class="status-row">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">בודק חיבור…</span>
        </div>
      </div>
      <div class="build-strip">
        <span>build <b id="buildNum">—</b></span>
        <span>commit <b id="commitHash">—</b></span>
      </div>
      <div class="body">
        <p class="lead">נתונים שהתקבלו מ-<span style="font-family:var(--mono)">api</span> דרך הרשת הפנימית:</p>
        <ul id="items"></ul>
      </div>

    <div class="card">
      <div class="card-head">
        <h1> API:🎲 הגרלה</h1>
      </div>
      <div class="body">
        <p class="lead">בחר טווח מספרים וקבל תוצאה אקראית מ-<span style="font-family:var(--mono)">api</span>:</p>
        <div class="random-box">
          <input type="number" id="minInput" placeholder="min">
          <input type="number" id="maxInput" placeholder="max">
          <button id="rollBtn">הגרל</button>
          <p id="randomResult"></p>
        </div>
      </div>    
    </div>
  </div>
</body>
</html>
